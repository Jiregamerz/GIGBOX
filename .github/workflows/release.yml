          ## Support

          For issues, see: https://github.com/${{ github.repository }}/issues

          RELEASEOF

      # ---------------------------------------------------------
      # 25. COPY GPIO MAP & CREATE README
      # ---------------------------------------------------------
      - name: Copy docs
        run: |
          # Copy GPIO map
          cp "$INTEGRATION_DIR/GIGBOX_GPIO_MAP.md" "$FINAL_DIR/"
          
          # Create README
          cp "$INTEGRATION_DIR/README.md" "$FINAL_DIR/" 2>/dev/null || cat > "$FINAL_DIR/README.md" << 'READMEEOF'
          # GIGBOX OS - FINAL RELEASE

          ## Overview
          GIGBOX is a modified Zynthian OS with custom hardware integration, theming, and features for the SPOOKI INSTRUMENTS GIGBOX hardware platform.

          ## Hardware
