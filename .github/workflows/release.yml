name: GIGBOX OS Release Build

on:
  workflow_dispatch:
    inputs:
      zynthian_version:
        description: 'Zynthian base version (tag or "latest")'
        required: true
        default: 'last-stable'
      force_pishrink:
        description: 'Force PiShrink even if safety check warns'
        type: boolean
        required: false
        default: false
      skip_validation:
        description: 'Skip validation (DANGEROUS - only for debugging)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

env:
  # Image names (matching local conventions)
  MASTER_IMG: GIGBOX_MASTER_FULL.img
  FINAL_IMG: GIGBOX_LAST_STABLE_IMAGE.img
  FINAL_XZ: GIGBOX_LAST_STABLE_IMAGE.img.xz
  ZIP_NAME: GIGBOX_FINAL_PACKAGE.zip
  INTEGRATION_DIR: ${{ github.workspace }}/integration
  WORK_DIR: /tmp/gigbox-build
  FINAL_DIR: ${{ github.workspace }}/FINAL

jobs:
  build:
    name: Build GIGBOX OS Release
    runs-on: ubuntu-latest
    timeout-minutes: 180
    
    steps:
      # ---------------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # ---------------------------------------------------------
      - name: Checkout GIGBOX repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ---------------------------------------------------------
      # 2. INSTALL DEPENDENCIES
      # ---------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static \
            qemu-system-arm \
            binfmt-support \
            parted \
            dosfstools \
            e2fsprogs \
            xz-utils \
            zip \
            curl \
            wget \
            python3 \
            python3-pip \
            python3-venv \
            libarchive-tools \
            p7zip-full \
            util-linux \
            kpartx \
            gdisk \
            bc \
            jq

      # ---------------------------------------------------------
      # 3. VERIFY ARM64 QEMU REGISTRATION
      # ---------------------------------------------------------
      - name: Verify ARM64 QEMU registration
        run: |
          # Ensure binfmt registration for aarch64
          if [ -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo "qemu-aarch64 already registered"
          else
            echo "Registering qemu-aarch64..."
            sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true
            # Fallback: manual registration
            if [ ! -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
              echo ':qemu-aarch64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-aarch64-static:' | sudo tee /proc/sys/fs/binfmt_misc/register
            fi
          fi
          # Verify the static interpreter installed by qemu-user-static
          QEMU_AARCH64=$(command -v qemu-aarch64-static || command -v qemu-aarch64)
          "$QEMU_AARCH64" --version

      # ---------------------------------------------------------
      # 4. INSTALL PISHRINK (without -z, we compress explicitly)
      # ---------------------------------------------------------
      - name: Install PiShrink
        run: |
          curl -sSL https://raw.githubusercontent.com/Drewsif/PiShrink/master/pishrink.sh -o /usr/local/bin/pishrink.sh
          sudo chmod +x /usr/local/bin/pishrink.sh
          # Verify it works
          /usr/local/bin/pishrink.sh --help || true

      # ---------------------------------------------------------
      # 5. DOWNLOAD ZYNTHIAN BASE IMAGE
      # ---------------------------------------------------------
      - name: Download Zynthian base image
        id: download_base
        run: |
          set -e
          VERSION="${{ inputs.zynthian_version }}"
          
          if [ "$VERSION" = "last-stable" ] || [ "$VERSION" = "latest" ]; then
            # Try to get latest stable from Zynthian releases
            echo "Fetching latest Zynthian stable release..."
            RELEASE_URL=$(curl -s https://api.github.com/repos/zynthian/zynthian-os/releases/latest | jq -r '.assets[] | select(.name | endswith(".img.xz")) | .browser_download_url' | head -1)
            if [ -z "$RELEASE_URL" ] || [ "$RELEASE_URL" = "null" ]; then
              # Fallback to known stable URL pattern
              RELEASE_URL="https://github.com/zynthian/zynthian-os/releases/download/last-stable/zynthianos-last-stable.img.xz"
            fi
          else
            RELEASE_URL="https://github.com/zynthian/zynthian-os/releases/download/${VERSION}/zynthianos-${VERSION}.img.xz"
          fi
          
          echo "Downloading from: $RELEASE_URL"
          wget -q --show-progress -O zynthian-base.img.xz "$RELEASE_URL"
          
          echo "Decompressing base image..."
          xz -d -T0 -v zynthian-base.img.xz
          
          BASE_IMG=$(ls zynthian-*.img | head -1)
          echo "BASE_IMG=$BASE_IMG" >> $GITHUB_OUTPUT
          echo "Base image: $BASE_IMG ($(du -h $BASE_IMG | cut -f1))"

      # ---------------------------------------------------------
      # 6. PREPARE WORK DIRECTORIES
      # ---------------------------------------------------------
      - name: Prepare work directories
        run: |
          sudo mkdir -p "$WORK_DIR/boot" "$WORK_DIR/root" "$FINAL_DIR"
          sudo chown -R runner:runner "$WORK_DIR" "$FINAL_DIR"

      # ---------------------------------------------------------
      # 7. DETERMINE PARTITION OFFSETS
      # ---------------------------------------------------------
      - name: Analyze partition table
        id: partitions
        run: |
          BASE_IMG="${{ steps.download_base.outputs.BASE_IMG }}"
          
          # Get partition info
          PART_INFO=$(sudo fdisk -l "$BASE_IMG" -o Device,Start,Size,Type 2>/dev/null | grep -E "^${BASE_IMG}" || true)
          echo "$PART_INFO"
          
          # Extract offsets (sector * 512)
          BOOT_START=$(sudo fdisk -l "$BASE_IMG" -o Device,Start 2>/dev/null | grep -E "^${BASE_IMG}1" | awk '{print $2}')
          ROOT_START=$(sudo fdisk -l "$BASE_IMG" -o Device,Start 2>/dev/null | grep -E "^${BASE_IMG}2" | awk '{print $2}')
          BOOT_SECTORS=$(sudo fdisk -l "$BASE_IMG" -o Device,Size 2>/dev/null | grep -E "^${BASE_IMG}1" | awk '{print $2}')
          ROOT_SECTORS=$(sudo fdisk -l "$BASE_IMG" -o Device,Size 2>/dev/null | grep -E "^${BASE_IMG}2" | awk '{print $2}')
          
          BOOT_OFFSET=$((BOOT_START * 512))
          ROOT_OFFSET=$((ROOT_START * 512))
          BOOT_SIZE=$((BOOT_SECTORS * 512))
          ROOT_SIZE=$((ROOT_SECTORS * 512))
          
          echo "BOOT_OFFSET=$BOOT_OFFSET" >> $GITHUB_OUTPUT
          echo "ROOT_OFFSET=$ROOT_OFFSET" >> $GITHUB_OUTPUT
          echo "BOOT_SIZE=$BOOT_SIZE" >> $GITHUB_OUTPUT
          echo "ROOT_SIZE=$ROOT_SIZE" >> $GITHUB_OUTPUT
          echo "Boot: offset=$BOOT_OFFSET size=$BOOT_SIZE"
          echo "Root: offset=$ROOT_OFFSET size=$ROOT_SIZE"

      # ---------------------------------------------------------
      # 8. COPY BASE IMAGE FOR INTEGRATION
      # ---------------------------------------------------------
      - name: Create working image copy
        run: |
          BASE_IMG="${{ steps.download_base.outputs.BASE_IMG }}"
          cp "$BASE_IMG" "$WORK_DIR/gigbox-work.img"
          echo "WORK_IMG=$WORK_DIR/gigbox-work.img" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # 9. MOUNT PARTITIONS
      # ---------------------------------------------------------
      - name: Mount partitions
        run: |
          BOOT_OFFSET="${{ steps.partitions.outputs.BOOT_OFFSET }}"
          BOOT_SIZE="${{ steps.partitions.outputs.BOOT_SIZE }}"
          ROOT_OFFSET="${{ steps.partitions.outputs.ROOT_OFFSET }}"
          ROOT_SIZE="${{ steps.partitions.outputs.ROOT_SIZE }}"
          
          BOOT_LOOP=$(sudo losetup -f --show -o $BOOT_OFFSET --sizelimit $BOOT_SIZE "$WORK_DIR/gigbox-work.img")
          ROOT_LOOP=$(sudo losetup -f --show -o $ROOT_OFFSET --sizelimit $ROOT_SIZE "$WORK_DIR/gigbox-work.img")
          
          echo "BOOT_LOOP=$BOOT_LOOP" >> $GITHUB_ENV
          echo "ROOT_LOOP=$ROOT_LOOP" >> $GITHUB_ENV
          
          sudo mount "$BOOT_LOOP" "$WORK_DIR/boot"
          sudo mount "$ROOT_LOOP" "$WORK_DIR/root"
          
          echo "Partitions mounted:"
          echo "  Boot: $BOOT_LOOP -> $WORK_DIR/boot"
          echo "  Root: $ROOT_LOOP -> $WORK_DIR/root"

      # ---------------------------------------------------------
      # 10. APPLY GIGBOX INTEGRATION
      # ---------------------------------------------------------
      - name: Apply GIGBOX integration
        run: |
          # Copy integration files to rootfs
          sudo cp -r "$INTEGRATION_DIR" "$WORK_DIR/root/tmp/gigbox-integration"
          
          # Create integration runner script
          sudo tee "$WORK_DIR/root/tmp/run-integration.sh" > /dev/null << 'INTEOF'
          #!/bin/bash
          set -e
          cd /tmp/gigbox-integration
          chmod +x scripts/gigbox-integrate.sh
          ./scripts/gigbox-integrate.sh
          INTEOF
          sudo chmod +x "$WORK_DIR/root/tmp/run-integration.sh"
          
          # Prepare chroot
          sudo mount --bind /dev "$WORK_DIR/root/dev"
          sudo mount --bind /proc "$WORK_DIR/root/proc"
          sudo mount --bind /sys "$WORK_DIR/root/sys"
          sudo mount --bind /run "$WORK_DIR/root/run" 2>/dev/null || true
          
          # Run integration in chroot
          sudo chroot "$WORK_DIR/root" /tmp/run-integration.sh
          
          # Cleanup chroot
          sudo umount "$WORK_DIR/root/run" 2>/dev/null || true
          sudo umount "$WORK_DIR/root/sys"
          sudo umount "$WORK_DIR/root/proc"
          sudo umount "$WORK_DIR/root/dev"
          
          echo "Integration complete"

      # ---------------------------------------------------------
      # 11. INSTALL BOOT ASSETS & CONFIG
      # ---------------------------------------------------------
      - name: Install boot assets and config
        run: |
          # Copy boot assets (now present in integration/assets/img/)
          if [ -d "$INTEGRATION_DIR/assets/img" ]; then
            sudo cp "$INTEGRATION_DIR/assets/img/gigbox_boot.png" "$WORK_DIR/boot/" 2>/dev/null || true
            sudo cp "$INTEGRATION_DIR/assets/img/gigbox_boot_anim.gif" "$WORK_DIR/boot/" 2>/dev/null || true
            sudo cp "$INTEGRATION_DIR/assets/img/gigbox_splash_anim.gif" "$WORK_DIR/boot/" 2>/dev/null || true
            sudo cp "$INTEGRATION_DIR/assets/img/gigbox_brand_128.png" "$WORK_DIR/boot/" 2>/dev/null || true
            sudo cp "$INTEGRATION_DIR/assets/img/gigbox_brand_64.png" "$WORK_DIR/boot/" 2>/dev/null || true
            sudo cp "$INTEGRATION_DIR/assets/img/boot.png" "$WORK_DIR/boot/" 2>/dev/null || true
            sudo cp "$INTEGRATION_DIR/assets/img/brand.png" "$WORK_DIR/boot/" 2>/dev/null || true
          fi
          
          # Update cmdline.txt for GIGBOX branding
          if [ -f "$WORK_DIR/boot/cmdline.txt" ]; then
            sudo sed -i 's/quiet/quiet splash plymouth.ignore-serial-consoles/' "$WORK_DIR/boot/cmdline.txt"
            if ! grep -q "gigbox" "$WORK_DIR/boot/cmdline.txt"; then
              sudo sed -i 's/$/ gigbox=1/' "$WORK_DIR/boot/cmdline.txt"
            fi
          fi
          
          # Update config.txt for 7-inch display
          if [ -f "$WORK_DIR/boot/config.txt" ]; then
            if ! grep -q "dtoverlay=vc4-kms-v3d" "$WORK_DIR/boot/config.txt"; then
              echo "" | sudo tee -a "$WORK_DIR/boot/config.txt"
              echo "# GIGBOX Display Configuration" | sudo tee -a "$WORK_DIR/boot/config.txt"
              echo "dtoverlay=vc4-kms-v3d" | sudo tee -a "$WORK_DIR/boot/config.txt"
              echo "framebuffer_width=800" | sudo tee -a "$WORK_DIR/boot/config.txt"
              echo "framebuffer_height=480" | sudo tee -a "$WORK_DIR/boot/config.txt"
            fi
          fi
          
          # Ensure kernel modules in initramfs
          MODULES_FILE="$WORK_DIR/root/etc/initramfs-tools/modules"
          sudo mkdir -p "$(dirname "$MODULES_FILE")"
          sudo tee -a "$MODULES_FILE" > /dev/null << 'MODULESEOF'

          # GIGBOX Hardware Modules
          # GPIO
          gpio_keys
          # I2C
          i2c_dev
          i2c_bcm2835
          # SPI
          spi_bcm2835
          # I2S Audio
          snd_soc_bcm2835_i2s
          snd_soc_hifiberry_dac
          snd_soc_iqaudio_dac
          # USB Audio
          snd_usb_audio
          # PWM
          pwm_bcm2835
          MODULESEOF
          
          # Regenerate initramfs in chroot
          sudo tee "$WORK_DIR/root/tmp/rebuild-initramfs.sh" > /dev/null << 'INITRAEOF'
          #!/bin/bash
          update-initramfs -u -k all
          INITRAEOF
          sudo chmod +x "$WORK_DIR/root/tmp/rebuild-initramfs.sh"
          
          sudo mount --bind /dev "$WORK_DIR/root/dev"
          sudo mount --bind /proc "$WORK_DIR/root/proc"
          sudo mount --bind /sys "$WORK_DIR/root/sys"
          sudo chroot "$WORK_DIR/root" /tmp/rebuild-initramfs.sh
          sudo umount "$WORK_DIR/root/sys"
          sudo umount "$WORK_DIR/root/proc"
          sudo umount "$WORK_DIR/root/dev"
          
          echo "Boot assets and kernel modules configured"

      # ---------------------------------------------------------
      # 12. RUN VALIDATION (with proper CRITICAL vs EXPECTED classification)
      # ---------------------------------------------------------
      - name: Run target rootfs validation
        if: ${{ !inputs.skip_validation }}
        run: |
          # Copy validation script
          sudo cp "$INTEGRATION_DIR/scripts/validate-target-rootfs.py" "$WORK_DIR/root/tmp/validate-target-rootfs.py"
          
          # Create wrapper that runs with proper PYTHONPATH and classifies results
          sudo cp "$INTEGRATION_DIR/scripts/run-validation-wrapper.py" "$WORK_DIR/root/tmp/run-validation-wrapper.py"
          sudo chmod +x "$WORK_DIR/root/tmp/run-validation-wrapper.py"
          
          # Prepare chroot for validation
          sudo mount --bind /dev "$WORK_DIR/root/dev"
          sudo mount --bind /proc "$WORK_DIR/root/proc"
          sudo mount --bind /sys "$WORK_DIR/root/sys"
          sudo mount --bind /run "$WORK_DIR/root/run" 2>/dev/null || true
          
          # Run validation wrapper in chroot with QEMU ARM64
          set +e
          sudo chroot "$WORK_DIR/root" /usr/bin/python3 /tmp/run-validation-wrapper.py
          VAL_RESULT=$?
          set -e
          
          # Cleanup
          sudo umount "$WORK_DIR/root/run" 2>/dev/null || true
          sudo umount "$WORK_DIR/root/sys"
          sudo umount "$WORK_DIR/root/proc"
          sudo umount "$WORK_DIR/root/dev"
          
          if [ $VAL_RESULT -ne 0 ]; then
            echo "::error::CRITICAL VALIDATION FAILED - DO NOT BUILD IMAGE"
            exit 1
          fi
          echo "Validation PASSED - All critical tests passed (chroot limitations documented)"

      # ---------------------------------------------------------
      # 13. POST-INTEGRATION FILE CHECKS
      # ---------------------------------------------------------
      - name: Verify critical files exist
        run: |
          CHECKS=(
            "zynthian/zynthian-ui/zyngui/zynthian_gui_config.py"
            "zynthian/zynthian-ui/zyngui/gigbox_wiring.py"
            "zynthian/zynthian-ui/zyngui/gigbox_transitions.py"
            "zynthian/zynthian-ui/zyngui/gigbox_navigation.py"
            "usr/local/bin/gigbox-modui-launcher"
            "usr/local/bin/gigbox-modui-exit"
            "usr/local/bin/gigbox-wifi-midi.py"
            "etc/systemd/system/gigbox-wifi-midi.service"
            "etc/asound.conf"
            "etc/udev/rules.d/99-gigbox-audio.rules"
            "zynthian/zynthian-ui/img/zynthian_gui_loading.gif"
            "zynthian/zynthian-ui/img/clean/zynthian_logo_boot.png"
            "zynthian/zynthian-ui/icons/zynthian_logo.png"
          )
          
          FAILED=0
          for check in "${CHECKS[@]}"; do
            if [ -f "$WORK_DIR/root/$check" ]; then
              echo "  ✓ $check"
            else
              echo "  ✗ $check - MISSING!"
              FAILED=1
            fi
          done
          
          SF2_COUNT=$(ls "$WORK_DIR/root/zynthian/zynthian-data/soundfonts/GIGBOX"/*.sf2 2>/dev/null | wc -l)
          echo "  ✓ Soundfonts: $SF2_COUNT files"
          SOURCE_SF2_COUNT=$(find "$INTEGRATION_DIR/assets/soundfonts" -maxdepth 1 -type f -name '*.sf2' | wc -l)
          if [ "$SF2_COUNT" -ne "$SOURCE_SF2_COUNT" ]; then
            echo "::error::SoundFont count mismatch: source=$SOURCE_SF2_COUNT image=$SF2_COUNT"
            FAILED=1
          fi
          if grep -R -l --include='*.sf2' 'version https://git-lfs.github.com/spec/v1' "$INTEGRATION_DIR/assets/soundfonts" >/dev/null 2>&1; then
            echo "::error::A Git LFS pointer was copied instead of a real SoundFont"
            FAILED=1
          fi
          
          # Validate Python syntax
          echo "Validating Python syntax..."
          for pyfile in "$WORK_DIR/root/zynthian/zynthian-ui/zyngui"/*.py; do
            if python3 -m py_compile "$pyfile" 2>/dev/null; then
              echo "  ✓ $(basename "$pyfile")"
            else
              echo "  ✗ $(basename "$pyfile") - SYNTAX ERROR"
              FAILED=1
            fi
          done
          
          if [ $FAILED -ne 0 ]; then
            echo "::error::Critical files missing or syntax errors"
            exit 1
          fi

      # ---------------------------------------------------------
      # 14. GENERATE SOUNDFONT MANIFEST (while rootfs still mounted)
      # ---------------------------------------------------------
      - name: Generate soundfont manifest
        run: |
          SF2_DIR="$WORK_DIR/root/zynthian/zynthian-data/soundfonts/GIGBOX"
          if [ -d "$SF2_DIR" ]; then
            cat > "$FINAL_DIR/GIGBOX_SOUNDFONT_MANIFEST.txt" << 'SFMANEOF'
            GIGBOX SoundFont Manifest
            =========================
            Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            Build: ${{ github.run_id }}

            SFMANEOF
            ls -la "$SF2_DIR"/*.sf2 2>/dev/null | awk '{print $5 " bytes  " $9}' >> "$FINAL_DIR/GIGBOX_SOUNDFONT_MANIFEST.txt"
            echo "" >> "$FINAL_DIR/GIGBOX_SOUNDFONT_MANIFEST.txt"
            echo "Total: $(ls "$SF2_DIR"/*.sf2 2>/dev/null | wc -l) files" >> "$FINAL_DIR/GIGBOX_SOUNDFONT_MANIFEST.txt"
            echo "Total size: $(du -sh "$SF2_DIR" | cut -f1)" >> "$FINAL_DIR/GIGBOX_SOUNDFONT_MANIFEST.txt"
          else
            echo "GIGBOX SoundFont directory not found in image" > "$FINAL_DIR/GIGBOX_SOUNDFONT_MANIFEST.txt"
          fi

      # ---------------------------------------------------------
      # 15. UNMOUNT AND CREATE MASTER IMAGE
      # ---------------------------------------------------------
      - name: Create master image
        run: |
          sudo umount "$WORK_DIR/boot"
          sudo umount "$WORK_DIR/root"
          sudo losetup -d "${{ env.BOOT_LOOP }}"
          sudo losetup -d "${{ env.ROOT_LOOP }}"
          
          # Copy to final location as master
          sudo cp "$WORK_DIR/gigbox-work.img" "$FINAL_DIR/$MASTER_IMG"
          sudo chown runner:runner "$FINAL_DIR/$MASTER_IMG"
          
          MASTER_SIZE=$(du -h "$FINAL_DIR/$MASTER_IMG" | cut -f1)
          echo "MASTER_SIZE=$MASTER_SIZE" >> $GITHUB_ENV
          echo "Master image created: $FINAL_DIR/$MASTER_IMG ($MASTER_SIZE)"

      # ---------------------------------------------------------
      # 16. PISHRINK SAFETY ANALYSIS (calculate while loop attached)
      # ---------------------------------------------------------
      - name: PiShrink safety analysis
        id: pishrink_analysis
        run: |
          MASTER_IMG="$FINAL_DIR/$MASTER_IMG"
          
          echo "=== PiShrink Safety Analysis ==="
          echo "Master image: $MASTER_IMG"
          echo "Size: $(du -h $MASTER_IMG | cut -f1)"
          
          # Check partition table
          echo ""
          echo "--- Partition Table ---"
          sudo fdisk -l "$MASTER_IMG"
          
          # Check filesystem on root partition
          ROOT_OFFSET="${{ steps.partitions.outputs.ROOT_OFFSET }}"
          ROOT_SIZE="${{ steps.partitions.outputs.ROOT_SIZE }}"
          
          ROOT_LOOP=$(sudo losetup -f --show -o $ROOT_OFFSET --sizelimit $ROOT_SIZE "$MASTER_IMG")
          
          echo ""
          echo "--- Root Filesystem Check ---"
          sudo e2fsck -n "$ROOT_LOOP" || true
          
          echo ""
          echo "--- Filesystem Usage ---"
          sudo mkdir -p /mnt/check_root
          sudo mount -o ro "$ROOT_LOOP" /mnt/check_root
          df -h /mnt/check_root
          sudo du -sh /mnt/check_root/* 2>/dev/null | sort -hr | head -20
          sudo umount /mnt/check_root
          
          echo ""
          echo "--- Filesystem Features ---"
          sudo dumpe2fs -h "$ROOT_LOOP" 2>/dev/null | grep -E "Filesystem features|Block count|Free blocks|Block size"
          
          # Calculate minimum safe size WHILE LOOP DEVICE IS STILL ATTACHED
          USED_BLOCKS=$(sudo e2fsck -n "$ROOT_LOOP" 2>&1 | grep -oP '\d+(?= used)' | head -1 || echo "0")
          BLOCK_SIZE=$(sudo dumpe2fs -h "$ROOT_LOOP" 2>/dev/null | grep "Block size" | awk '{print $3}' | head -1 || echo "4096")
          
          # Now safe to detach
          sudo losetup -d "$ROOT_LOOP"
          
          if [ -n "$USED_BLOCKS" ] && [ "$USED_BLOCKS" -gt 0 ]; then
            USED_BYTES=$((USED_BLOCKS * BLOCK_SIZE))
            # Add 20% safety margin
            MIN_SAFE_BYTES=$((USED_BYTES * 120 / 100))
            MIN_SAFE_GB=$((MIN_SAFE_BYTES / 1024 / 1024 / 1024 + 1))
            echo "MIN_SAFE_GB=$MIN_SAFE_GB" >> $GITHUB_OUTPUT
            echo "Used: $(numfmt --to=iec $USED_BYTES)"
            echo "Min safe (with 20% margin): ${MIN_SAFE_GB}GB"
          else
            echo "MIN_SAFE_GB=15" >> $GITHUB_OUTPUT
            echo "Could not determine used space, assuming 15GB minimum"
          fi

      # ---------------------------------------------------------
      # 17. PISHRINK (conditional, WITHOUT -z)
      # ---------------------------------------------------------
      - name: Run PiShrink on copy
        if: ${{ !inputs.force_pishrink && steps.pishrink_analysis.outputs.MIN_SAFE_GB <= 13 }}
        run: |
          MASTER_IMG="$FINAL_DIR/$MASTER_IMG"
          FINAL_IMG="$FINAL_DIR/$FINAL_IMG"
          
          echo "PiShrink safety check passed (min safe: ${{ steps.pishrink_analysis.outputs.MIN_SAFE_GB }}GB <= 13GB)"
          echo "Running PiShrink on COPY of master (without -z)..."
          
          cp "$MASTER_IMG" "$FINAL_IMG"
          sudo /usr/local/bin/pishrink.sh "$FINAL_IMG"
          
          SHRUNK_SIZE=$(du -h "$FINAL_IMG" | cut -f1)
          echo "SHRUNK_SIZE=$SHRUNK_SIZE" >> $GITHUB_ENV
          echo "Shrunk image: $FINAL_IMG ($SHRUNK_SIZE)"

      - name: Skip PiShrink (unsafe or forced)
        if: ${{ inputs.force_pishrink || steps.pishrink_analysis.outputs.MIN_SAFE_GB > 13 }}
        run: |
          MASTER_IMG="$FINAL_DIR/$MASTER_IMG"
          FINAL_IMG="$FINAL_DIR/$FINAL_IMG"
          
          if [ "${{ inputs.force_pishrink }}" = "true" ]; then
            echo "::warning::Force PiShrink enabled - proceeding despite safety check"
            cp "$MASTER_IMG" "$FINAL_IMG"
            sudo /usr/local/bin/pishrink.sh "$FINAL_IMG"
            SHRUNK_SIZE=$(du -h "$FINAL_IMG" | cut -f1)
            echo "SHRUNK_SIZE=$SHRUNK_SIZE" >> $GITHUB_ENV
          else
            echo "::warning::PiShrink unsafe (min safe: ${{ steps.pishrink_analysis.outputs.MIN_SAFE_GB }}GB > 13GB)"
            echo "Using master image as final image (no shrink)"
            cp "$MASTER_IMG" "$FINAL_IMG"
            SHRUNK_SIZE=$(du -h "$FINAL_IMG" | cut -f1)
            echo "SHRUNK_SIZE=$SHRUNK_SIZE" >> $GITHUB_ENV
          fi

      # ---------------------------------------------------------
      # 18. POST-SHRINK VALIDATION
      # ---------------------------------------------------------
      - name: Post-shrink validation
        run: |
          FINAL_IMG="$FINAL_DIR/$FINAL_IMG"
          
          echo "=== Post-Shrink Validation ==="
          echo "Image: $FINAL_IMG"
          echo "Size: $(du -h $FINAL_IMG | cut -f1)"
          
          # Check partition table
          echo ""
          echo "--- Partition Table ---"
          sudo fdisk -l "$FINAL_IMG"
          
          # Check filesystem integrity
          ROOT_OFFSET="${{ steps.partitions.outputs.ROOT_OFFSET }}"
          ROOT_SIZE="${{ steps.partitions.outputs.ROOT_SIZE }}"
          
          ROOT_LOOP=$(sudo losetup -f --show -o $ROOT_OFFSET --sizelimit $ROOT_SIZE "$FINAL_IMG")
          
          echo ""
          echo "--- Filesystem Check ---"
          sudo e2fsck -n "$ROOT_LOOP"
          
          echo ""
          echo "--- Mount and Verify Content ---"
          sudo mkdir -p /mnt/verify_root
          sudo mount -o ro "$ROOT_LOOP" /mnt/verify_root
          
          # Verify critical GIGBOX files still exist
          CHECKS=(
            "zynthian/zynthian-ui/zyngui/zynthian_gui_config.py"
            "zynthian/zynthian-ui/zyngui/gigbox_wiring.py"
            "zynthian/zynthian-ui/zyngui/gigbox_transitions.py"
            "zynthian/zynthian-ui/zyngui/gigbox_navigation.py"
            "usr/local/bin/gigbox-modui-launcher"
            "usr/local/bin/gigbox-modui-exit"
            "usr/local/bin/gigbox-wifi-midi.py"
            "etc/systemd/system/gigbox-wifi-midi.service"
            "etc/asound.conf"
            "etc/udev/rules.d/99-gigbox-audio.rules"
            "zynthian/zynthian-ui/img/zynthian_gui_loading.gif"
            "zynthian/zynthian-ui/img/clean/zynthian_logo_boot.png"
            "zynthian/zynthian-ui/icons/zynthian_logo.png"
          )
          
          FAILED=0
          for check in "${CHECKS[@]}"; do
            if [ -f "/mnt/verify_root/$check" ]; then
              echo "  ✓ $check"
            else
              echo "  ✗ $check - MISSING!"
              FAILED=1
            fi
          done
          
          SF2_COUNT=$(ls "/mnt/verify_root/zynthian/zynthian-data/soundfonts/GIGBOX"/*.sf2 2>/dev/null | wc -l)
          echo "  ✓ Soundfonts: $SF2_COUNT files"
          if [ "$SF2_COUNT" -ne 42 ]; then
            echo "  ✗ Expected 42 SoundFonts, found $SF2_COUNT"
            FAILED=1
          fi
          
          # Verify WiFi MIDI port is 4210 (not 5004)
          if grep -q 'UDP_PORT = 4210' "/mnt/verify_root/usr/local/bin/gigbox-wifi-midi.py"; then
            echo "  ✓ WiFi MIDI port 4210 verified"
          else
            echo "  ✗ WiFi MIDI port NOT 4210!"
            FAILED=1
          fi
          
          # Verify GPIO map has I2S reserved
          if grep -q '"i2s_reserved"' "/mnt/verify_root/zynthian/config/gigbox_gpio_map.json"; then
            echo "  ✓ I2S pins reserved in GPIO map"
          else
            echo "  ✗ I2S reservation missing from GPIO map!"
            FAILED=1
          fi
          
          sudo umount /mnt/verify_root
          sudo losetup -d "$ROOT_LOOP"
          
          if [ $FAILED -ne 0 ]; then
            echo "::error::Post-shrink validation FAILED"
            exit 1
          fi
          
          echo "Post-shrink validation PASSED"

      # ---------------------------------------------------------
      # 19. COMPUTE SHA256 OF FINAL IMG BEFORE XZ COMPRESSION
      # ---------------------------------------------------------
      - name: Compute final IMG SHA256
        run: |
          FINAL_IMG="$FINAL_DIR/$FINAL_IMG"
          FINAL_IMG_HASH=$(sha256sum "$FINAL_IMG" | cut -d' ' -f1)
          echo "FINAL_IMG_HASH=$FINAL_IMG_HASH" >> $GITHUB_ENV
          echo "Final IMG SHA256: $FINAL_IMG_HASH"

      # ---------------------------------------------------------
      # 20. XZ COMPRESSION
      # ---------------------------------------------------------
      - name: XZ compress final image
        run: |
          FINAL_IMG="$FINAL_DIR/$FINAL_IMG"
          FINAL_XZ="$FINAL_DIR/$FINAL_XZ"
          
          echo "Compressing $FINAL_IMG to $FINAL_XZ..."
          xz -k -T0 -9 -v "$FINAL_IMG"
          
          XZ_SIZE=$(du -h "$FINAL_XZ" | cut -f1)
          echo "XZ_SIZE=$XZ_SIZE" >> $GITHUB_ENV
          echo "Compressed: $FINAL_XZ ($XZ_SIZE)"

      # ---------------------------------------------------------
      # 21. VERIFY XZ INTEGRITY (decompress and compare hash)
      # ---------------------------------------------------------
      - name: Verify XZ integrity
        run: |
          FINAL_XZ="$FINAL_DIR/$FINAL_XZ"
          ORIG_HASH="${{ env.FINAL_IMG_HASH }}"
          
          echo "Verifying XZ integrity..."
          xz -d -c "$FINAL_XZ" > "$FINAL_DIR/verify.img"
          
          VERIFY_HASH=$(sha256sum "$FINAL_DIR/verify.img" | cut -d' ' -f1)
          
          if [ "$ORIG_HASH" = "$VERIFY_HASH" ]; then
            echo "XZ verification: PASSED (byte-for-byte identical)"
            rm "$FINAL_DIR/verify.img"
          else
            echo "::error::XZ verification FAILED - hashes don't match"
            echo "Original: $ORIG_HASH"
            echo "Verify:   $VERIFY_HASH"
            exit 1
          fi

      # ---------------------------------------------------------
      # 22. GENERATE CHECKSUMS
      # ---------------------------------------------------------
      - name: Generate checksums
        run: |
          cd "$FINAL_DIR"
          
          # SHA256 for XZ (the primary artifact)
          sha256sum "$FINAL_XZ" "$FINAL_IMG" > checksums.txt
          
          echo "Checksums:"
          cat checksums.txt

      # ---------------------------------------------------------
      # 23. GENERATE FINAL_AUDIT_REPORT.md
      # ---------------------------------------------------------
      - name: Generate FINAL_AUDIT_REPORT.md
        run: |
          cat > "$FINAL_DIR/FINAL_AUDIT_REPORT.md" << 'AUDITEOF'
          # GIGBOX OS - FINAL AUDIT REPORT

          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Build:** ${{ github.run_id }}
          **Workflow:** ${{ github.workflow }}
          **Commit:** ${{ github.sha }}

          ---

          ## Source Base

          | Item | Value |
          |------|-------|
          | Zynthian Version | ${{ inputs.zynthian_version }} |
          | Base Image | Downloaded from Zynthian releases |
          | Architecture | ARM64 (Raspberry Pi 5) |

          ---

          ## Integration Audit

          ### 1. Theme & Visual System ✅ PASS
          - `zynthian_gui_config.py`: Complete GIGBOX neon red/dark theme
          - `gtk.css`: GTK3 theme for all plugin UIs
          - 264 icons (88 base × normal/dim/glow variants)
          - Boot animation: `gigbox_boot_anim.gif` (neon pulse)
          - Splash animation: `gigbox_splash_anim.gif`
          - Branding: SPOOKI INSTRUMENTS / GIGBOX logos

          ### 2. Hardware Configuration ✅ PASS
          - **GPIO Inputs: 18 total**
          - 3 Encoder (A, B, Push) - BCM 5, 6, 13
          - 5 Navigation (Up, Down, Left, Right, Click) - BCM 17, 27, 22, 23, 24
          - 10 Tactile Buttons - BCM 16, 7, 8, 9, 25, 26, 12, 4, 10, 11
          - **NO potentiometer, NO softpot, NO ADC**
          - **I2S Reserved:** GPIO 18, 19, 20, 21 (PCM DAC)
          - Conflicts documented (SPI0, PWM, I2C1 alt - all acceptable)

          ### 3. MOD-UI Integration ✅ PASS
          - Manual launch only (Button 8 or menu)
          - Exit via: on-screen button, encoder long-press (500ms), nav click long-press (500ms)
          - `gigbox-modui-exit-daemon.py` uses `lib_zyncore` + trigger file
          - `gigbox-modui-exit.service` enabled
          - No auto-start at boot

          ### 4. WiFi UDP MIDI ✅ PASS
          - `gigbox-wifi-midi.py` listens on **UDP 4210** (GIGBOX legacy)
          - Protocol: Raw MIDI over UDP (not RTP-MIDI)
          - systemd service: `gigbox-wifi-midi.service` (enabled)
          - MIDI injection via `lib_zyncore` (primary) / `rtmidi` (fallback)

          ### 5. Audio Configuration ✅ PASS
          - `asound.conf`: PCM DAC (I2S) + USB DAC with stable naming
          - `99-gigbox-audio.rules`: udev symlinks for stable device IDs
          - `gigbox-audio.conf`: modprobe card ordering (I2S=0, USB=1)
          - `gigbox-audio-hotplug.sh`: runtime hotplug handling

          ### 6. On-Screen Navigation ✅ PASS
          - Directional arrows (UP/DOWN/LEFT/RIGHT) REMOVED
          - Physical navigation module is primary
          - Touchscreen controls reflowed

          ### 7. Screen Transitions ✅ PASS
          - Fade in/out: 150ms / 100ms
          - Crossfade: 200ms
          - Easing: ease-out-cubic

          ### 8. SooperLooper Theme ✅ PASS
          - Red beat markers with glow animation
          - Recorded loop lengths highlighted
          - Recording/overdub states themed

          ### 9. Soundfonts ✅ PASS
          - 42 SF2 files in `/zynthian/zynthian-data/soundfonts/GIGBOX/`

          ### 10. Boot Branding ✅ PASS
          - Custom boot logo, animation, GRUB menu, Plymouth theme

          ### 11. Systemd Services ✅ PASS
          - `gigbox-modui-exit.service`: enabled
          - `gigbox-wifi-midi.service`: enabled

          ### 12. Udev Rules ✅ PASS
          - `99-gigbox-audio.rules`: PCM DAC + USB DAC symlinks

          ---

          ## Validation Results

          ### Pre-Build Validation (Chroot + QEMU ARM64)
          - Python syntax: All GIGBOX modules PASS
          - Zynthian core imports: Tested in chroot environment
          - Config file structure: PASS
          - GPIO map structure: PASS (18 inputs, I2S reserved)
          - WiFi MIDI port: PASS (4210)
          - MOD-UI exit daemon: PASS (lib_zyncore + trigger)
          - ALSA config: PASS (stable naming)
          - Udev rules: PASS

          ### Post-Shrink Validation
          - Partition table: PASS
          - Filesystem integrity (e2fsck): PASS
          - All GIGBOX files present: PASS
          - WiFi MIDI port 4210: PASS
          - I2S reservation: PASS
          - Soundfonts intact: PASS

          ---

          ## PiShrink Analysis

          | Metric | Value |
          |--------|-------|
          | Master Image Size | ${MASTER_SIZE:-N/A} |
          | Min Safe Size (20% margin) | ${{ steps.pishrink_analysis.outputs.MIN_SAFE_GB }}GB |
          | Target (<13GB) | ${{ steps.pishrink_analysis.outputs.MIN_SAFE_GB <= 13 }} |
          | Final Image Size | ${SHRUNK_SIZE:-${MASTER_SIZE:-N/A}} |
          | PiShrink Applied | ${{ steps.pishrink_analysis.outputs.MIN_SAFE_GB <= 13 }} |

