          | Physical navigation module (5-way) | NOT TESTABLE WITHOUT HARDWARE |
          | 10 tactile buttons | NOT TESTABLE WITHOUT HARDWARE |
          | PCM DAC I2S audio output | NOT TESTABLE WITHOUT HARDWARE |
          | USB DAC / Microphone | NOT TESTABLE WITHOUT HARDWARE |
          | 7-inch 800x480 MIPI DSI touchscreen | NOT TESTABLE WITHOUT HARDWARE |
          | Real MIDI hardware (USB/WiFi) | NOT TESTABLE WITHOUT HARDWARE |
          | MOD-UI Chromium kiosk on display | NOT TESTABLE WITHOUT HARDWARE |
          | Boot animation on real hardware | NOT TESTABLE WITHOUT HARDWARE |

