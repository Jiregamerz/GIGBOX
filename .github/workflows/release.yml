          - 10x Tactile Buttons
          - PCM DAC (I2S) Main Output
          - USB DAC Headphones/Mic

          ## Features
          - Dark neon red theme (near black, PCB trace design)
          - Custom boot animation & branding
          - MOD-UI launches manually (Button 8), exits via encoder long press
          - WiFi UDP MIDI receiver (auto-start, UDP 4210)
          - USB DAC auto-detection
          - 42 GIGBOX soundfonts included
          - All Zynthian functionality preserved

          ## Flashing
          ```bash
          sudo dd if=GIGBOX_LAST_STABLE_IMAGE.img of=/dev/sdX bs=4M status=progress
          sync
          ```

          ## GPIO Map
          See GIGBOX_GPIO_MAP.md for complete wiring diagram.

          ## Credits
          Based on Zynthian OS (https://zynthian.org)
          Theme & Integration: SPOOKI INSTRUMENTS
          READMEEOF

      # ---------------------------------------------------------
      # 26. CREATE FINAL ZIP PACKAGE
      # ---------------------------------------------------------
      - name: Create final ZIP package
        run: |
          cd "$FINAL_DIR"
          
          # Create ZIP with release materials (NOT the master image)
          zip -r "$ZIP_NAME" \
            "$FINAL_XZ" \
            checksums.txt \
            FINAL_AUDIT_REPORT.md \
            FINAL_RELEASE_REPORT.md \
            GIGBOX_GPIO_MAP.md \
            GIGBOX_SOUNDFONT_MANIFEST.txt \
            README.md
          
          ZIP_SIZE=$(du -h "$ZIP_NAME" | cut -f1)
          echo "ZIP_SIZE=$ZIP_SIZE" >> $GITHUB_ENV
          echo "ZIP created: $ZIP_NAME ($ZIP_SIZE)"

      # ---------------------------------------------------------
      # 27. MONITOR DISK SPACE
      # ---------------------------------------------------------
      - name: Monitor disk space
        if: always()
        run: |
          echo "=== Disk Space Usage ==="
          df -h /
          echo ""
          echo "=== Build Directory Sizes ==="
          du -sh "${{ env.WORK_DIR }}" 2>/dev/null || true
          du -sh "${{ env.FINAL_DIR }}" 2>/dev/null || true

      # ---------------------------------------------------------
      # 28. UPLOAD ARTIFACTS
      # ---------------------------------------------------------
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GIGBOX-Release-${{ github.run_id }}
          path: |
            ${{ env.FINAL_DIR }}/${{ env.FINAL_XZ }}
            ${{ env.FINAL_DIR }}/${{ env.FINAL_IMG }}
            ${{ env.FINAL_DIR }}/checksums.txt
            ${{ env.FINAL_DIR }}/FINAL_AUDIT_REPORT.md
            ${{ env.FINAL_DIR }}/FINAL_RELEASE_REPORT.md
            ${{ env.FINAL_DIR }}/GIGBOX_GPIO_MAP.md
            ${{ env.FINAL_DIR }}/GIGBOX_SOUNDFONT_MANIFEST.txt
            ${{ env.FINAL_DIR }}/README.md
            ${{ env.FINAL_DIR }}/${{ env.ZIP_NAME }}
          retention-days: 30

      # ---------------------------------------------------------
      # 29. SUMMARY
      # ---------------------------------------------------------
      - name: Build Summary
        run: |
          echo ""
          echo "=========================================="
          echo "GIGBOX OS RELEASE BUILD COMPLETE"
          echo "=========================================="
          echo ""
          echo "Primary Artifact: ${{ env.FINAL_XZ }}"
          echo "  Size: ${XZ_SIZE:-N/A}"
          echo ""
          echo "Master Image: ${{ env.MASTER_IMG }}"
          echo "  Size: ${MASTER_SIZE:-N/A}"
          echo ""
          echo "Final Image: ${{ env.FINAL_IMG }}"
          echo "  Size: ${SHRUNK_SIZE:-${MASTER_SIZE:-N/A}}"
          echo ""
          echo "PiShrink safe threshold: ${{ steps.pishrink_analysis.outputs.MIN_SAFE_GB <= 13 }}"
          echo "  Min safe size: ${{ steps.pishrink_analysis.outputs.MIN_SAFE_GB }}GB"
          echo ""
          echo "ZIP Package: ${{ env.ZIP_NAME }}"
          echo "  Size: ${ZIP_SIZE:-N/A}"
          echo ""
          echo "Artifacts uploaded to GitHub Actions"
          echo ""
          echo "=========================================="
          echo "RELEASE READY"
          echo "=========================================="

  # ---------------------------------------------------------
  # CLEANUP (always runs)
  # ---------------------------------------------------------
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: build
    if: always()
    timeout-minutes: 10
    steps:
      - name: Cleanup loop devices
        run: |
          sudo losetup -D 2>/dev/null || true
          # Clean up actual CI mount paths
          sudo umount /mnt/check_root 2>/dev/null || true
          sudo umount /mnt/verify_root 2>/dev/null || true
          sudo umount /tmp/gigbox-build/boot 2>/dev/null || true
          sudo umount /tmp/gigbox-build/root 2>/dev/null || true
          echo "Cleanup complete"
