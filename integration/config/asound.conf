# GIGBOX ALSA Configuration - Stable Device Identification
# SPOOKI INSTRUMENTS - GIGBOX
# Hardware:
#   Primary: Raspberry Pi 5 I2S/PCM DAC (Main L/R Output)
#   Secondary: USB DAC (Headphones/Microphone)
# 
# Uses stable ALSA device identification via:
#   - Device hints/descriptions
#   - Udev rules for consistent naming
#   - No hardcoded card numbers

# ============================================================================
# PCM DEVICE IDENTIFICATION RULES
# ============================================================================

# PCM DAC (I2S) - Identified by device name/description
# Typical names: "sndrpihifiberry", "sndrpiiqaudio", "sndrpidaemon", "bcm2835-i2s"
pcm.!default {
    type plug
    slave.pcm "gigbox_main"
    hint.description "GIGBOX Default Output"
}

ctl.!default {
    type hw
    card 0
}

# ============================================================================
# NAMED PCM DEVICES - Stable references for Zynthian
# ============================================================================

# Main stereo output (PCM DAC via I2S)
# Uses device hint to find I2S DAC regardless of card number
pcm.gigbox_main {
    type plug
    slave.pcm {
        @func refer
        name "gigbox_pcm_dac_hw"
    }
    hint.description "GIGBOX Main Output (PCM DAC L/R via I2S)"
}

# Headphone output (USB DAC)
# Uses device hint to find USB Audio Class device
pcm.gigbox_headphones {
    type plug
    slave.pcm {
        @func refer
        name "gigbox_usb_dac_hw"
    }
    hint.description "GIGBOX Headphones (USB DAC)"
}

# Microphone input (USB DAC)
pcm.gigbox_mic {
    type plug
    slave.pcm {
        @func refer
        name "gigbox_usb_mic_hw"
    }
    hint.description "GIGBOX Microphone (USB DAC)"
}

# ============================================================================
# HARDWARE LAYER - Device identification via udev/ALSA hints
# ============================================================================

# PCM DAC Hardware - Match I2S DAC by name pattern
pcm.gigbox_pcm_dac_hw {
    type hw
    # Card will be resolved by udev rule / ALSA device hint
    # Fallback to card 0 if hint fails
    card "PCM"
    device 0
    hint.description "PCM DAC (I2S)"
    hint.device_name "pcm_dac"
}

ctl.gigbox_pcm_dac_hw {
    type hw
    card "PCM"
}

# USB DAC Hardware - Match USB Audio Class device
pcm.gigbox_usb_dac_hw {
    type hw
    card "USB"
    device 0
    hint.description "USB DAC (Headphones)"
    hint.device_name "usb_dac"
}

ctl.gigbox_usb_dac_hw {
    type hw
    card "USB"
}

# USB Microphone Hardware
pcm.gigbox_usb_mic_hw {
    type hw
    card "USB"
    device 0
    hint.description "USB DAC (Microphone)"
    hint.device_name "usb_mic"
}

ctl.gigbox_usb_mic_hw {
    type hw
    card "USB"
}

# ============================================================================
# FALLBACK DEVICES - Used when primary identification fails
# ============================================================================

# Fallback PCM DAC (card 0)
pcm.gigbox_pcm_dac_fallback {
    type hw
    card 0
    device 0
}

# Fallback USB DAC (card 1)
pcm.gigbox_usb_dac_fallback {
    type hw
    card 1
    device 0
}

# ============================================================================
# DMIX FOR SOFTWARE MIXING
# ============================================================================

pcm.dmix_gigbox_main {
    type dmix
    ipc_key 1024
    slave {
        pcm "gigbox_pcm_dac_hw"
        rate 48000
        period_size 1024
        buffer_size 4096
        channels 2
    }
}

pcm.dmix_gigbox_headphones {
    type dmix
    ipc_key 1025
    slave {
        pcm "gigbox_usb_dac_hw"
        rate 48000
        period_size 1024
        buffer_size 4096
        channels 2
    }
}

# ============================================================================
# HIGH-RESOLUTION SUPPORT
# ============================================================================

pcm.highres_gigbox_main {
    type plug
    slave {
        pcm "gigbox_pcm_dac_hw"
        format S24_LE
        rate 96000
    }
}

pcm.highres_gigbox_headphones {
    type plug
    slave {
        pcm "gigbox_usb_dac_hw"
        format S24_LE
        rate 96000
    }
}

# ============================================================================
# JACK COMPATIBILITY
# ============================================================================

pcm.jack_gigbox_main {
    type jack
    playback_ports {
        0 system:playback_1
        1 system:playback_2
    }
    capture_ports {
        0 system:capture_1
        1 system:capture_2
    }
}

# ============================================================================
# LOOPBACK FOR RECORDING/MONITORING
# ============================================================================

pcm.gigbox_loopback {
    type plug
    slave.pcm "hw:Loopback,0,0"
}

# ============================================================================
# CONTROL INTERFACES
# ============================================================================

ctl.gigbox_main {
    type hw
    card "PCM"
}

ctl.gigbox_headphones {
    type hw
    card "USB"
}

ctl.gigbox_mic {
    type hw
    card "USB"
}

# ============================================================================
# ZYNTHIAN-SPECIFIC ALIASES
# ============================================================================

pcm.zynthian_out {
    type plug
    slave.pcm "gigbox_main"
}

pcm.zynthian_in {
    type plug
    slave.pcm "gigbox_mic"
}

pcm.zynthian_headphones {
    type plug
    slave.pcm "gigbox_headphones"
}