# GIGBOX Audio Module Configuration
# SPOOKI INSTRUMENTS - GIGBOX
# Ensures correct sound card ordering:
# Card 0 = PCM DAC (I2S) - Main L/R Output
# Card 1 = USB DAC - Headphones/Mic

# ============================================================================
# PCM DAC (I2S) - Load first, becomes card 0
# ============================================================================

# Hifiberry DAC/DAC+ Pro
options snd_soc_hifiberry_dac index=0
options snd_soc_hifiberry_dacplus index=0
options snd_soc_hifiberry_dacplusadc index=0
options snd_soc_hifiberry_dacplusdsp index=0

# IQaudio DAC/DAC+
options snd_soc_iqaudio_dac index=0
options snd_soc_iqaudio_dacplus index=0

# Generic Raspberry Pi I2S DAC
options snd_soc_rpi_dac index=0

# Generic simple-card I2S
options snd_soc_simple_card index=0

# ============================================================================
# USB Audio - Load after I2S, becomes card 1+
# ============================================================================
options snd_usb_audio index=1,2,3,4,5,6,7,8

# ============================================================================
# Prevent HDMI audio from taking card 0
# ============================================================================
options snd_bcm2835 index=10

# ============================================================================
# Loopback for virtual routing (if needed)
# ============================================================================
options snd_aloop index=9

# ============================================================================
# Audio buffer sizes for low latency
# ============================================================================
options snd_pcm_prealloc_size=16384