# Initial safe ALSA map. gigbox-audio-hotplug.sh rewrites this using card IDs.
pcm.gigbox_pcm_dac_hw {
    type hw
    card 0
    device 0
}
ctl.gigbox_pcm_dac_hw {
    type hw
    card 0
}
pcm.gigbox_usb_dac_hw {
    type hw
    card 1
    device 0
}
ctl.gigbox_usb_dac_hw {
    type hw
    card 1
}
pcm.gigbox_usb_mic_hw {
    type hw
    card 1
    device 0
}
pcm.gigbox_main {
    type plug
    slave.pcm "gigbox_pcm_dac_hw"
}
pcm.gigbox_headphones {
    type plug
    slave.pcm "gigbox_usb_dac_hw"
}
pcm.gigbox_mic {
    type plug
    slave.pcm "gigbox_usb_mic_hw"
}
pcm.!default {
    type plug
    slave.pcm "gigbox_main"
}
ctl.!default {
    type hw
    card 0
}
pcm.zynthian_out {
    type plug
    slave.pcm "gigbox_main"
}
pcm.zynthian_in {
    type plug
    slave.pcm "gigbox_mic"
}
